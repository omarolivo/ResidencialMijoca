<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1F1F"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="gradTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E29662"/>
      <stop offset="100%" stop-color="#C87D4B"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle luxury border -->
  <rect width="512" height="512" rx="112" fill="url(#gradObsidian)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#C87D4B" stroke-width="3" stroke-opacity="0.3"/>
  
  <!-- Architectural House Silhouette & Balcony Motif -->
  <g transform="translate(256, 250)">
    <!-- Roof Peak -->
    <path d="M-130,-10 L0,-115 L130,-10 L105,10 L0,-75 L-105,10 Z" fill="url(#gradTerracotta)"/>
    <!-- House Body -->
    <path d="M-95,15 L95,15 L95,130 L-95,130 Z" fill="none" stroke="url(#gradTerracotta)" stroke-width="14" stroke-linejoin="round"/>
    <!-- Balcony Glass / Railing slats -->
    <rect x="-80" y="70" width="160" height="48" rx="6" fill="#1C1E1D" stroke="#C87D4B" stroke-width="4"/>
    <line x1="-50" y1="70" x2="-50" y2="118" stroke="#C87D4B" stroke-width="3"/>
    <line x1="-20" y1="70" x2="-20" y2="118" stroke="#C87D4B" stroke-width="3"/>
    <line x1="10" y1="70" x2="10" y2="118" stroke="#C87D4B" stroke-width="3"/>
    <line x1="40" y1="70" x2="40" y2="118" stroke="#C87D4B" stroke-width="3"/>
    <!-- RM Monogram or Star -->
    <circle cx="0" cy="-25" r="14" fill="#C87D4B"/>
    <polygon points="0,-48 4,-33 19,-33 7,-24 11,-9 0,-18 -11,-9 -7,-24 -19,-33 -4,-33" fill="#FAF7F2"/>
  </g>

  <!-- Wordmark at bottom -->
  <text x="256" y="445" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#FAF7F2" text-anchor="middle" letter-spacing="3">MIJOCA</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#C87D4B" text-anchor="middle" letter-spacing="4">SANTIAGO · RD</text>
</svg>
